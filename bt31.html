
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 31 - Tính tích số chia hết cho 7</title>
</head>
<body>

    <h1>Tính tích các số chia hết cho 7</h1>

    <form onsubmit="handleSubmit(event)">
        <label>Số đầu:</label>
        <input type="number" id="soDau" required>

        <br><br>

        <label>Số cuối:</label>
        <input type="number" id="soCuoi" required>

        <br><br>

        <button type="submit">Tính tích</button>
    </form>

    <h3 id="ketQua"></h3>

    <script>
        function handleSubmit(event) {
            event.preventDefault();

            const soDau = Number(document.getElementById("soDau").value);
            const soCuoi = Number(document.getElementById("soCuoi").value);

            let tich = 1;
            let dem = 0;

            for (let i = soDau; i <= soCuoi; i++) {
                if (i % 7 == 0) {
                    tich = tich * i;
                    dem++;
                }
            }

            if (dem > 0) {
                document.getElementById("ketQua").innerHTML =
                    "Tích các số chia hết cho 7 là: " + tich;
            } else {
                document.getElementById("ketQua").innerHTML =
                    "Không có số nào chia hết cho 7 trong khoảng này.";
            }
        }
    </script>

</body>
</html>
